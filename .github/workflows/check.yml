name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: helper/screen/webrtc-requirements.txt
      - run: pip install -r helper/screen/webrtc-requirements.txt
      - run: python test/webrtc-worker.test.py
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run test/windows.test.ts test/windows-video.test.ts test/windows-ipc.test.ts test/windows-display.test.ts test/control-coordinator.test.ts test/preferences-migration.test.ts test/viewer-input-queue.test.ts test/viewer-frame-loop.test.ts test/translations.test.ts test/frame-metrics.test.ts test/viewer-sessions.test.ts test/native-video.test.ts test/native-video-view.test.ts test/video-config.test.ts
      - run: npm run test:viewer
      - name: Parse provisioning scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($file in @('scripts/windows-provision-display.ps1', 'scripts/windows-rollback-display.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - name: Compile native Windows helper
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /out:"$env:RUNNER_TEMP\paseo-rc-helper.exe" /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll "$PWD\helper\screen\windows.cs"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: helper/screen/webrtc-requirements.txt
      - run: pip install -r helper/screen/webrtc-requirements.txt
      - run: python test/webrtc-worker.test.py
